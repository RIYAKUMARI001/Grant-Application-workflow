{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GrantFlow</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">G</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your GrantFlow account</p>
            </div>

            <form method="post" class="auth-form">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-error">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <div class="form-group">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" id="id_username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" id="id_password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}" class="auth-link">Create one</a>
            </div>
        </div>

        <div class="back-home">
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>
    </div>
</body>
</html>
